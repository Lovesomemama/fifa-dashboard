name: build-fifa-data

on:
  workflow_dispatch:
  schedule:
    # 8:30 по Киеву. cron в UTC!
    # Лето (UTC+3): 30 5  |  Зима (UTC+2): 30 6  <- поменять в конце октября
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: build-fifa-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pandas pyarrow openpyxl
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Write service account key
        run: echo "$GDRIVE_SA_JSON" > sa.json
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}

      - name: Pull parquet from Google Drive
        env:
          RCLONE_CONFIG_GD_TYPE: drive
          RCLONE_CONFIG_GD_SCOPE: drive.readonly
          RCLONE_CONFIG_GD_SERVICE_ACCOUNT_FILE: sa.json
          RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy gd: . --include "*_fifa_score.parquet" --transfers 8 -v
          ls -la *_fifa_score.parquet Players_Groups_History.xlsx

      - name: Build fifa_data.json
        run: python build_fifa_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fifa_data.json
          if git diff --cached --quiet; then
            echo "No changes — данные не изменились, коммита нет."
          else
            # Данные реально обновились — пишем метку времени + статистику
            python -c "import json,datetime; d=json.load(open('fifa_data.json')); dt=[r[2] for r in d]; json.dump({'updated_utc':datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')+'Z','matches':len(d),'earliest_date':min(dt),'latest_date':max(dt)}, open('last_update.json','w'), ensure_ascii=False, indent=2)"
            cat last_update.json
            git add last_update.json
            git commit -m "auto: update fifa_data.json ($(date -u +%F' '%T)Z)"
            git push
          fi

      - name: Cleanup secrets
        if: always()
        run: rm -f sa.json
