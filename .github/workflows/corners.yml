name: corners-to-sheet
on:
  schedule:
    - cron: "47 6 * * *"   # ~08:47 Madrid until 25.10, then ~07:47
    - cron: "47 9 * * *"   # backup run if GitHub delays/skips the morning one
  workflow_dispatch:
    inputs:
      build_calc:
        description: "Build a new calculator tab (CALC_v1, CALC_v2, ...)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow gspread google-api-python-client google-auth
      - run: python corners_to_sheet.py
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          DAYS_BACK: "180"
          BUILD_CALC: ${{ github.event_name == 'workflow_dispatch' && inputs.build_calc && '1' || '0' }}
      - name: keepalive (re-enable schedule, no commits)
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/corners.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
