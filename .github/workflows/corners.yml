name: corners-to-sheet
on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 Madrid / 08:30 Kyiv (winter). Summer (end of March): "30 5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow gspread google-api-python-client google-auth
      - run: python corners_to_sheet.py
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          DAYS_BACK: "180"
      - uses: gautamkrishnar/keepalive-workflow@v2
